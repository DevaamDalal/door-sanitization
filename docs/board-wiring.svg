3a6" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="start">E18-D80NK: active LOW</text><text x="489" y="647" fill="#c56719" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="700" text-anchor="start">VIN: not connected</text><text x="489" y="693" fill="#526a7b" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="400" text-anchor="start">D4: reserved, not implemented</text><rect x="1006" y="225" width="470" height="545" rx="10" fill="white" stroke="#cbd8e3" stroke-width="2"/><text x="1029" y="266" fill="#102b41" font-family="Arial, Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="start">3 LOAD CHANNELS</text><text x="1033" y="317" fill="#2563a6" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700" text-anchor="start">PUMP</text><text x="1033" y="354" fill="#19344b" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="400" text-anchor="start">Load + → 24 V   |   Load − → Drain</text><text x="1033" y="383" fill="#19344b" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="400" text-anchor="start">Gate → 330 Ω → D5</text><text x="1033" y="411" fill="#19344b" font-family="Arial, Segoe UI, sans-serif" font-size="15" font-weight="400" text-anchor="start">Source → GND   |   Gate → 10k → Source</text><text x="1033" y="445" fill="#2563a6" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700" text-anchor="start">VALVE 1</text><text x="1033" y="482" fill="#19344b" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="400" text-anchor="start">Load + → 24 V   |   Load − → Drain</text><text x="1033" y="511" fill="#19344b" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="400" text-anchor="start">Gate → 330 Ω → D6</text><text x="1033" y="539" fill="#19344b" font-family="Arial, Segoe UI, sans-serif" font-size="15" font-weight="400" text-anchor="start">Source → GND   |   Gate → 10k → Source</text><text x="1033" y="573" fill="#2563a6" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700" text-anchor="start">VALVE 2</text><text x="1033" y="610" fill="#19344b" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="400" text-anchor="start">Load + → 24 V   |   Load − → Drain</text><text x="1033" y="639" fill="#19344b" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="400" text-anchor="start">Gate → 330 Ω → D7</text><text x="1033" y="667" fill="#19344b" font-family="Arial, Segoe UI, sans-serif" font-size="15" font-weight="400" text-anchor="start">Source → GND   |   Gate → 10k → Source</text><rect x="44" y="807" width="1432" height="111" rx="10" fill="#e9f7f2" stroke="#17755c" stroke-width="2"/><text x="65" y="843" fill="#17755c" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="start">Across EACH load: add properly rated flyback protection; diode K at +24 V and A at Drain.</text><text x="65" y="878" fill="#526a7b" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="400" text-anchor="start">The supplied rail diode does not replace load clamps. Check 7805 temperature at 24 V input.</text></svg>
